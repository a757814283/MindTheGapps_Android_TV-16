name: Build GApps for Android TV (Android 16)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update system and install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential curl git lz4 patch python3 repo squashfs-tools wget xz-utils zip

    - name: Clone MindTheGapps For AndroidTV (Android 16)
      run: |
        git clone --branch baklava https://gitlab.com/MindTheGapps/vendor_gapps_tv.git

    - name: Build GApps for Android TV
      run: |
        cd vendor_gapps_tv
        make gapps_tv_arm64 -j$(nproc)

    - name: Creating Release GApps for Android TV (Android 16)
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.REPO_TOKEN }}
        files: |
          vendor_gapps_tv/out/MindTheGapps-16.0.0-arm64-ATV-full-*.zip
        name: GApps For TV (Android 16)
        tag_name: ATV-16
        draft: false
        prerelease: false
